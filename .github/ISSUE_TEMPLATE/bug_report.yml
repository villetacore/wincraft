name: Bug report
description: Report a reproducible WinCraft problem.
body:
  - type: markdown
    attributes:
      value: Please remove personal information and secrets from logs. Security vulnerabilities belong in a private report; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: v0.4.0-preview.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, QEMU version, BIOS/UEFI, acceleration, RAM and CPU count.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Include only the relevant excerpt; remove identifying information.
