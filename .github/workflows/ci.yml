name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libraries:
    name: Libraries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets
  guest:
    name: Linux guest workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install guest development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgtk-4-dev libwebkitgtk-6.0-dev
          rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable check --workspace --all-targets --locked
  repository:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-repository.py
      - name: Validate pinned Buildroot configuration
        run: bash scripts/check-buildroot.sh
      - name: Shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
