name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'README*'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    # Set WINCRAFT_BUILD_RUNNER to a JSON array, e.g.
    # ["self-hosted","linux","x64","wincraft-builder"], for a larger builder.
    runs-on: ${{ fromJSON(vars.WINCRAFT_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reclaim hosted runner disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - name: Prepare build host
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils qemu-system-x86 ovmf
          sudo bash build/builder.sh setup
      - name: Build ISO and source bundle
        env:
          WINCRAFT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          WINCRAFT_JOBS: '2'
        run: |
          mkdir -p dist
          sudo --preserve-env=WINCRAFT_RELEASE_TAG,WINCRAFT_JOBS bash build/builder.sh run bash build/release.sh 2>&1 | tee dist/build.log
      - name: Boot BIOS image
        run: python3 scripts/smoke-iso.py dist/wincraft-os.iso
      - name: Boot UEFI image
        run: python3 scripts/smoke-iso.py dist/wincraft-os.iso --uefi
      - name: Upload boot-tested ISO
        uses: actions/upload-artifact@v7
        with:
          name: wincraft-iso-${{ github.run_number }}
          path: |
            dist/wincraft-os.iso
            dist/wincraft-os.iso.sha256
            dist/release/wincraft-launcher.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Archive verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Archive build and boot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs
          path: |
            dist/build.log
            dist/smoke-*.log
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      - name: Verify assets and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          cd release
          sha256sum -c SHA256SUMS
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --draft --prerelease --title "WinCraft OS $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
