set timeout=4
# fbcon=nodefer: the console sets the display mode at boot. With the deferred takeover
# (Alpine kernels) no CRTC is set when labwc starts and its first modeset never completes.
set default=0
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
insmod all_video
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

menuentry "WinCraft OS @VERSION@" {
    linux /boot/vmlinuz wincraft.media=@BUILD_ID@ console=tty0 console=ttyS0,115200 fbcon=nodefer quiet loglevel=3
    initrd /boot/initramfs.img
}
menuentry "WinCraft OS @VERSION@ - verify installation media" {
    linux /boot/vmlinuz wincraft.media=@BUILD_ID@ wincraft.verify console=tty0 console=ttyS0,115200 fbcon=nodefer loglevel=4
    initrd /boot/initramfs.img
}
menuentry "WinCraft OS @VERSION@ - debug (serial root shell)" {
    linux /boot/vmlinuz wincraft.media=@BUILD_ID@ wincraft.debug console=tty0 console=ttyS0,115200 fbcon=nodefer loglevel=6
    initrd /boot/initramfs.img
}
