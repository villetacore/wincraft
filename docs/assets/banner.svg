<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">WinCraft OS</title>
  <desc id="desc">A familiar desktop. An open foundation. Blue geometric artwork inspired by the WinCraft desktop.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172f"/><stop offset="1" stop-color="#163f70"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#47b8ff" stop-opacity=".32"/><stop offset="1" stop-color="#47b8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="face" x2="1" y2="1"><stop stop-color="#77ddff"/><stop offset="1" stop-color="#32a7f0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8acbff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <ellipse cx="1010" cy="195" rx="340" ry="300" fill="url(#glow)"/>
  <g fill="none" stroke="#6dcfff" stroke-opacity=".16">
    <path d="m958 32 208 120v176L958 448 750 328V152Z"/>
    <path d="m958 92 156 90v132l-156 90-156-90V182Z"/>
    <path d="M958 92v312M802 182l156 90 156-90"/>
  </g>
