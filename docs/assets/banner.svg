      <text x="259" y="322">WAYLAND</text><circle cx="363" cy="318" r="2" fill="#47b8ff"/>
      <text x="383" y="322">WINE</text>
    </g>
    <text x="1120" y="322" text-anchor="end" fill="#7bafd5" font-size="12" letter-spacing="2">BY VILLETACORE</text>
