    <path d="m0 23 40 23v46L0 69Z" fill="#147ed1"/>
    <path d="m40 46 40-23v46L40 92Z" fill="#35b9ef"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="177" y="113" fill="#f3f9ff" font-size="56" font-weight="700" letter-spacing="-2">WinCraft <tspan fill="#70d5ff" font-weight="400">OS</tspan></text>
    <text x="76" y="210" fill="#f3f9ff" font-size="33" font-weight="600" letter-spacing="-.7">A familiar desktop.</text>
    <text x="76" y="253" fill="#a9c9e6" font-size="33" font-weight="400" letter-spacing="-.7">An open foundation.</text>
